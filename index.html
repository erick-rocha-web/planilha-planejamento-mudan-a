<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha | Planejamento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Nosso Planejamento</h1>
        <p>Organizando nosso futuro juntos</p>

        <div>
            <p>Meta: R$ <span id="meta-valor">20000</span></p>
            <p>Atual: R$ <span id="saldo-valor">0</span></p>
        </div>
    </header>

    <!-- RESUMO -->
    <section>
        <h2>Resumo</h2>

        <div>
            <p>Total Planejado: R$ <span id="total-planejado">0</span></p>
            <p>Total Gasto: R$ <span id="total-gasto">0</span></p>
            <p>Falta: R$ <span id="total-restante">0</span></p>
        </div>
    </section>

    <!-- NAVEGAÇÃO -->
    <nav>
        <button data-tab="fixas">Despesas Fixas</button>
        <button data-tab="variaveis">Despesas Variáveis</button>
        <button data-tab="planejamento">Planejamento</button>
    </nav>

    <!-- LISTA DE DESPESAS -->
    <section id="lista-despesas">

        <h2>Despesas</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabela-body">
                <!-- JS vai inserir aqui -->
            </tbody>

        </table>

    </section>

    <!-- FORMULÁRIO -->
    <section>
        <h2>Adicionar Item</h2>

        <form id="form-item">

            <div>
                <label>Nome do item</label>
                <input type="text" id="input-nome" required>
            </div>

            <div>
                <label>Categoria</label>
                <select id="input-categoria">
                    <option value="fixa">Fixa</option>
                    <option value="variavel">Variável</option>
                    <option value="planejamento">Planejamento</option>
                </select>
            </div>

            <div>
                <label>Valor</label>
                <input type="number" id="input-valor" required>
            </div>

            <button type="submit">Adicionar</button>

        </form>
    </section>

    <!-- PLANEJAMENTO FUTURO -->
    <section>
        <h2>Planejamento Futuro</h2>

        <ul id="lista-planejamento">
            <!-- JS vai inserir -->
        </ul>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>Projeto pessoal de planejamento financeiro</p>
    </footer>

</body>
<script src="script.js"></script>

</html>
